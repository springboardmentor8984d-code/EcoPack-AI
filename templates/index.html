<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPack AI - Smart Packaging Recommendations</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
        :root {
            --bg-primary: #0f0a1a;
            --bg-secondary: #1a1230;
            --accent-purple: #a78bfa;
            --accent-pink: #ec4899;
            --button-bg: #6d28d9;
            --text-primary: #f3e8ff;
            --text-secondary: #c4b5fd;
            --glow-color: #a78bfa;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .app-wrapper {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Outfit', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ========== HERO SECTION ========== */
        .hero {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 24px;
            background: linear-gradient(135deg, #0f0a1a 0%, #1a0f2e 50%, #2d1b4e 100%);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 720px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            line-height: 1.15;
            margin: 0 0 24px 0;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.7;
            color: var(--text-secondary);
            margin: 0 0 40px 0;
        }

        .hero-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            background: transparent;
            color: var(--accent-purple);
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.5), inset 0 0 20px rgba(167, 139, 250, 0.1);
            position: relative;
        }

        .hero-button:hover {
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.8), inset 0 0 30px rgba(167, 139, 250, 0.2);
            transform: translateY(-2px);
        }

        /* ========== FORM SECTION ========== */
        .form-section {
            padding: 80px 24px;
            background: linear-gradient(180deg, #0f0a1a 0%, #1a0f2e 100%);
        }

        .form-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(26, 18, 48, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 30px rgba(167, 139, 250, 0.2);
            border: 2px solid var(--accent-purple);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .form-wrapper h2 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
        }

        .form-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-purple);
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--accent-purple);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            background-color: rgba(26, 18, 48, 0.6);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a78bfa' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
            box-shadow: inset 0 0 15px rgba(167, 139, 250, 0.1);
        }

        select:hover {
            border-color: var(--accent-pink);
            box-shadow: inset 0 0 15px rgba(167, 139, 250, 0.1), 0 0 20px rgba(236, 72, 153, 0.3);
        }

        select:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(167, 139, 250, 0.1);
        }

        .submit-button {
            width: 100%;
            margin-top: 32px;
            padding: 14px 32px;
            background: transparent;
            color: var(--accent-purple);
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.5), inset 0 0 20px rgba(167, 139, 250, 0.1);
        }

        .submit-button:hover {
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.8), inset 0 0 30px rgba(167, 139, 250, 0.2);
            transform: translateY(-2px);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        /* ========== FOOTER ========== */
        footer {
            padding: 40px 24px;
            background: rgba(26, 18, 48, 0.8);
            border-top: 1px solid var(--accent-purple);
            text-align: center;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 640px) {
            .hero {
                padding: 40px 20px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .form-wrapper {
                padding: 32px 24px;
            }

            .form-wrapper h2 {
                font-size: 1.5rem;
            }
        }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>

  <script>
        const defaultConfig = {
            hero_title: 'EcoPack AI',
            hero_subtitle: 'Smart AI-powered sustainable packaging recommendations based on cost, CO₂ impact, and durability.',
            form_title: 'Get Recommendations',
            cta_button_text: 'Get Recommendations',
            submit_button_text: 'Generate Recommendation',
            bg_color: '#0f0a1a',
            accent_purple: '#a78bfa',
            button_bg: '#6d28d9',
            text_primary: '#f3e8ff',
            text_secondary: '#c4b5fd',
            font_family: 'Outfit',
            font_size: 16
        };

        let config = { ...defaultConfig };

        function onConfigChange(cfg) {
            const heroTitle = document.getElementById('hero-title');
            const heroSubtitle = document.getElementById('hero-subtitle');
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');

            if (heroTitle) heroTitle.textContent = cfg.hero_title || defaultConfig.hero_title;
            if (heroSubtitle) heroSubtitle.textContent = cfg.hero_subtitle || defaultConfig.hero_subtitle;
            if (formTitle) formTitle.textContent = cfg.form_title || defaultConfig.form_title;
            if (submitBtn) submitBtn.textContent = cfg.submit_button_text || defaultConfig.submit_button_text;

            const bgColor = cfg.bg_color || defaultConfig.bg_color;
            const accentPurple = cfg.accent_purple || defaultConfig.accent_purple;
            const textPrimary = cfg.text_primary || defaultConfig.text_primary;
            const textSecondary = cfg.text_secondary || defaultConfig.text_secondary;

            document.documentElement.style.setProperty('--bg-primary', bgColor);
            document.documentElement.style.setProperty('--accent-purple', accentPurple);
            document.documentElement.style.setProperty('--text-primary', textPrimary);
            document.documentElement.style.setProperty('--text-secondary', textSecondary);
            document.documentElement.style.setProperty('--glow-color', accentPurple);

            const fontFamily = cfg.font_family || defaultConfig.font_family;
            const fontSize = cfg.font_size || defaultConfig.font_size;

            document.querySelectorAll('.heading-font').forEach(el => {
                el.style.fontFamily = `${fontFamily}, sans-serif`;
            });

            document.body.style.fontSize = `${fontSize}px`;
        }

        function mapToCapabilities(cfg) {
            return {
                recolorables: [
                    {
                        get: () => cfg.bg_color || defaultConfig.bg_color,
                        set: (value) => { cfg.bg_color = value; if (window.elementSdk) window.elementSdk.setConfig({ bg_color: value }); }
                    },
                    {
                        get: () => cfg.accent_purple || defaultConfig.accent_purple,
                        set: (value) => { cfg.accent_purple = value; if (window.elementSdk) window.elementSdk.setConfig({ accent_purple: value }); }
                    },
                    {
                        get: () => cfg.text_primary || defaultConfig.text_primary,
                        set: (value) => { cfg.text_primary = value; if (window.elementSdk) window.elementSdk.setConfig({ text_primary: value }); }
                    }
                ],
                borderables: [],
                fontEditable: {
                    get: () => cfg.font_family || defaultConfig.font_family,
                    set: (value) => { cfg.font_family = value; if (window.elementSdk) window.elementSdk.setConfig({ font_family: value }); }
                },
                fontSizeable: {
                    get: () => cfg.font_size || defaultConfig.font_size,
                    set: (value) => { cfg.font_size = value; if (window.elementSdk) window.elementSdk.setConfig({ font_size: value }); }
                }
            };
        }

        function mapToEditPanelValues(cfg) {
            return new Map([
                ['hero_title', cfg.hero_title || defaultConfig.hero_title],
                ['hero_subtitle', cfg.hero_subtitle || defaultConfig.hero_subtitle],
                ['form_title', cfg.form_title || defaultConfig.form_title],
                ['cta_button_text', cfg.cta_button_text || defaultConfig.cta_button_text],
                ['submit_button_text', cfg.submit_button_text || defaultConfig.submit_button_text]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }

        function scrollToForm() {
            document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' });
        }

    // allow normal submission
}
